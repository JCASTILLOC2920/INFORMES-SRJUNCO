<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JC PATH LAB - Generador de Informes</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .medical-blue {
            background-color: #0c4a6e;
        }
        .medical-text {
            color: #0c4a6e;
        }
        textarea {
            resize: vertical;
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- Header -->
    <header class="medical-blue text-white py-6 shadow-lg mb-8">
        <div class="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white p-2 rounded-full">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                    </svg>
                </div>
                <h1 class="text-3xl font-bold tracking-tight">JC PATH LAB</h1>
            </div>
            <p class="text-blue-100 font-medium mt-2 md:mt-0 italic">Sistema de Gestión de Informes Anatomopatológicos</p>
        </div>
    </header>

    <main class="container mx-auto px-4 max-w-5xl">
        <!-- Notification Area -->
        <div id="alert-container" class="hidden mb-6">
            <div id="alert-box" class="flex items-center p-4 rounded-lg border">
                <div id="alert-icon" class="flex-shrink-0 mr-3"></div>
                <div id="alert-message" class="text-sm font-medium"></div>
                <button onclick="hideAlert()" class="ml-auto bg-transparent text-gray-400 hover:text-gray-900 rounded-lg p-1.5 inline-flex items-center">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        </div>

        <form id="report-form" class="bg-white rounded-xl shadow-md overflow-hidden animate-fade-in transition-all duration-300">
            <div class="p-6 md:p-8 space-y-8">
                
                <!-- Patient Data Section -->
                <section>
                    <div class="flex items-center space-x-2 border-b-2 border-blue-50 pb-2 mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 medical-text" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd" />
                        </svg>
                        <h2 class="text-xl font-semibold text-gray-800 uppercase tracking-wide">Datos del Paciente</h2>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="md:col-span-2">
                            <label for="patientName" class="block text-sm font-bold text-gray-700 mb-1">Nombre del Paciente <span class="text-red-500">*</span></label>
                            <input type="text" id="patientName" name="patientName" placeholder="Ej. Juan Pérez" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="age" class="block text-sm font-bold text-gray-700 mb-1">Edad</label>
                            <input type="number" id="age" name="age" placeholder="0" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="patientId" class="block text-sm font-bold text-gray-700 mb-1">ID / Código <span class="text-red-500">*</span></label>
                            <input type="text" id="patientId" name="patientId" placeholder="Ej. B-2024-001" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="receptionDate" class="block text-sm font-bold text-gray-700 mb-1">Fecha de Recepción</label>
                            <input type="date" id="receptionDate" name="receptionDate" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="reportDate" class="block text-sm font-bold text-gray-700 mb-1">Fecha de Informe</label>
                            <input type="date" id="reportDate" name="reportDate" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="indName" class="block text-sm font-bold text-gray-700 mb-1">Médico que indica (IND)</label>
                            <input type="text" id="indName" name="indName" placeholder="Ej. Dr. Smith" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                        <div>
                            <label for="sampleType" class="block text-sm font-bold text-gray-700 mb-1">Muestra</label>
                            <input type="text" id="sampleType" name="sampleType" placeholder="Ej. Biopsia gástrica" class="w-full px-4 py-2 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none">
                        </div>
                    </div>
                </section>

                <!-- Medical Examination Details -->
                <section>
                    <div class="flex items-center space-x-2 border-b-2 border-blue-50 pb-2 mb-6">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 medical-text" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z" />
                        </svg>
                        <h2 class="text-xl font-semibold text-gray-800 uppercase tracking-wide">Hallazgos Médicos</h2>
                    </div>
                    
                    <div class="space-y-6">
                        <div>
                            <label for="macroscopy" class="block text-sm font-bold text-gray-700 mb-2">Examen Macroscópico</label>
                            <textarea id="macroscopy" name="macroscopy" rows="5" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none min-h-[120px] w-full" placeholder="Describa el aspecto macroscópico de la muestra..."></textarea>
                        </div>
                        <div>
                            <label for="microscopy" class="block text-sm font-bold text-gray-700 mb-2">Examen Microscópico</label>
                            <textarea id="microscopy" name="microscopy" rows="7" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none min-h-[150px] w-full" placeholder="Describa los hallazgos microscópicos..."></textarea>
                        </div>
                        <div>
                            <label for="diagnosis" class="block text-sm font-bold text-gray-700 mb-2">Diagnóstico</label>
                            <textarea id="diagnosis" name="diagnosis" rows="4" class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all outline-none min-h-[100px] w-full" placeholder="Conclusión diagnóstica definitiva..."></textarea>
                        </div>
                    </div>
                </section>


                <!-- Actions -->
                <div class="pt-4 flex flex-col md:flex-row gap-4">
                    <button type="submit" id="generateBtn" class="flex-grow medical-blue hover:bg-blue-900 text-white font-bold py-4 px-8 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 active:scale-95 flex justify-center items-center space-x-2">
                        <span id="btnText">Generar Informe Word</span>
                        <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                    </button>
                    <button type="button" id="clearBtn" class="md:w-1/4 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-4 px-8 rounded-xl transition-all flex justify-center items-center space-x-2">
                        <span>Limpiar</span>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>
            <div class="bg-gray-50 px-8 py-4 border-t border-gray-100 italic text-xs text-gray-400 text-center">
                JC PATH LAB &copy; 2024 - Herramienta de automatización interna para patólogos.
            </div>
        </form>
    </main>

    <!-- Dependencies for Word Generation -->
    <script src="https://cdn.jsdelivr.net/npm/pizzip@3.1.7/dist/pizzip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docxtemplater@3.49.1/build/docxtemplater.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('report-form');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const clearBtn = document.getElementById('clearBtn');
        const alertContainer = document.getElementById('alert-container');
        const alertBox = document.getElementById('alert-box');
        const alertMessage = document.getElementById('alert-message');
        const alertIcon = document.getElementById('alert-icon');

        function showAlert(message, type = 'error') {
            alertContainer.classList.remove('hidden');
            alertMessage.textContent = message;
            
            if (type === 'error') {
                alertBox.className = 'flex items-center p-4 rounded-lg border bg-red-50 border-red-200 text-red-800 animate-bounce-short';
                alertIcon.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>`;
            } else {
                alertBox.className = 'flex items-center p-4 rounded-lg border bg-blue-50 border-blue-200 text-blue-800';
                alertIcon.innerHTML = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path></svg>`;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideAlert() {
            alertContainer.classList.add('hidden');
        }

        // Clear Form Logic
        clearBtn.addEventListener('click', () => {
            const inputs = form.querySelectorAll('input:not([type="file"]), textarea');
            inputs.forEach(input => {
                input.value = '';
            });
            hideAlert();
            // We keep the templateLoaded to avoid uploading it again as requested
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (typeof window.PizZip === 'undefined') {
                return showAlert('Error crítico: La librería PizZip no se cargó correctamente. Por favor, recarga la página con Ctrl+F5.');
            }

            hideAlert();

            const patientName = document.getElementById('patientName').value.trim();
            const patientId = document.getElementById('patientId').value.trim();

            // Validations
            if (!patientName) return showAlert('El Nombre del Paciente es obligatorio.');
            if (!patientId) return showAlert('El ID / Código es obligatorio.');

            // Start Loading State
            generateBtn.disabled = true;
            btnText.textContent = 'Generando...';
            generateBtn.classList.add('opacity-75', 'cursor-wait');

            try {
                // Obtener la plantilla localmente usando fetch
                const response = await fetch('plantilla.docx', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('No se pudo cargar la plantilla local.');
                }
                const arrayBuffer = await response.arrayBuffer();
                const zip = new PizZip(arrayBuffer);
                
                // Inicializar docxtemplater
                const doc = new docxtemplater(zip, {
                    linebreaks: true,
                    paragraphLoop: true,
                });

                // Obtener datos del formulario
                const data = {
                    patientName: patientName,
                    age: document.getElementById('age').value || '--',
                    patientId: patientId,
                    receptionDate: document.getElementById('receptionDate').value || '--',
                    reportDate: document.getElementById('reportDate').value || '--',
                    ind: document.getElementById('indName').value || '--',
                    muestra: document.getElementById('sampleType').value || '--',
                    macroscopy: document.getElementById('macroscopy').value || 'No se registraron hallazgos.',
                    microscopy: document.getElementById('microscopy').value || 'No se registraron hallazgos.',
                    diagnosis: document.getElementById('diagnosis').value || 'Pendiente.'
                };

                // Renderizar documento
                doc.render(data);

                const out = doc.getZip().generate({
                    type: "blob",
                    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
                });

                // Guardar archivo
                const fileName = `Informe_${patientName.replace(/\s+/g, '_')}.docx`;
                saveAs(out, fileName);

            } catch (error) {
                console.error(error);
                showAlert('Error del sistema: ' + (error.message || error));
            } finally {
                resetBtn();
            }
        });

        function resetBtn() {
            setTimeout(() => {
                generateBtn.disabled = false;
                btnText.textContent = 'Generar Informe Word';
                generateBtn.classList.remove('opacity-75', 'cursor-wait');
            }, 1000);
        }
        });
    </script>
    
    <style>
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-bounce-short {
            animation: bounceShort 0.5s ease-in-out;
        }
        @keyframes bounceShort {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
    </style>
</body>
</html>
